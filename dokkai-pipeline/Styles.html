<style>
  /* ============================================================
     多読講座パイプライン スタイル（プロトタイプを「正」として再現）
     ============================================================ */
  :root{
    --bg:#f5f6f7; --panel:#ffffff; --ink:#1c2127; --sub:#6b7280;
    --line:#e3e6ea; --line2:#eef0f3; --accent:#0f9d6e; --accent-d:#0b7d57;
    --danger:#d9534f; --warn:#e8a33d; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    --s1:#64748b; --s2:#3b82f6; --s3:#0ea5a4; --s4:#e8a33d; --s5:#8b5cf6; --s6:#d97706; --s7:#0f9d6e; --s8:#9ca3af;
    --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .brand{font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
  .brand small{font-weight:500;color:var(--sub);font-size:11px}
  .spacer{flex:1}
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 11px;font-weight:600;transition:.12s}
  button:hover{background:#f3f4f6}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-d)}
  button:disabled{opacity:.55;cursor:default}
  button.ghost{border-color:transparent;background:transparent;color:var(--sub)}
  button.ghost:hover{background:#f1f2f4;color:var(--ink)}
  button.danger{color:var(--danger);border-color:#f1d3d2}
  button.danger:hover{background:#fdf2f2}
  .board{display:flex;gap:12px;padding:14px 16px 40px;overflow-x:auto;min-height:calc(100vh - 56px);align-items:flex-start}
  .col{flex:0 0 248px;background:#eef0f2;border-radius:11px;display:flex;flex-direction:column;max-height:calc(100vh - 90px)}
  .col.dragover{outline:2px dashed var(--accent);outline-offset:-2px;background:#e7f4ee}
  .col-h{padding:10px 12px 8px;display:flex;align-items:center;gap:7px;position:sticky;top:0}
  .col-h .pip{width:9px;height:9px;border-radius:50%}
  .col-h .name{font-weight:700;font-size:12px;flex:1;letter-spacing:.01em}
  .col-h .cnt{font-size:11px;color:var(--sub);background:#fff;border-radius:20px;padding:1px 8px;font-weight:600}
  .col-body{padding:0 8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;box-shadow:var(--shadow);cursor:grab;position:relative}
  .card:active{cursor:grabbing}
  .card:hover{border-color:#cdd2d8}
  .card .nm{font-weight:700;font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
  /* 各項目を「ラベル: 値」で明記して分かりやすく */
  .card .rows{display:flex;flex-direction:column;gap:2px}
  .card .r{display:flex;gap:6px;font-size:11px;line-height:1.45}
  .card .r .k{flex:0 0 40px;color:#9aa1ab;font-weight:600}
  .card .r .v{color:var(--ink);font-variant-numeric:tabular-nums;word-break:break-word}
  .card .lvl{display:inline-block;font-size:10px;font-weight:700;padding:0 6px;border-radius:5px;background:#eef2f6;border:1px solid var(--line)}
  .bell{font-size:10px;font-weight:700;color:#fff;background:var(--danger);border-radius:5px;padding:1px 6px;margin-left:auto;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .empty{color:#9aa1ab;font-size:11px;text-align:center;padding:14px 4px;border:1px dashed #d7dbe0;border-radius:8px;margin:2px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:34px 16px;overflow-y:auto}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
  .m-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .m-h .t{font-weight:700;font-size:15px}
  .m-h .sub{font-size:11px;color:var(--sub)}
  .m-b{padding:16px 18px;max-height:64vh;overflow-y:auto}
  .m-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#fafbfc}
  .move-row{display:flex;align-items:center;gap:9px;background:#f3f8f5;border:1px solid #d6ece1;border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .move-row label{font-size:11px;color:var(--accent-d);font-weight:700}
  .move-row select{flex:1}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld.full{grid-column:1 / -1}
  .fld label{font-size:11px;font-weight:700;color:#374151}
  .fld label .req{color:var(--danger);margin-left:3px}
  .fld label .opt{color:#9aa1ab;font-weight:500;margin-left:4px}
  input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,157,110,.12)}
  textarea{resize:vertical;min-height:54px}
  .fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--danger);background:#fff7f7}
  .hint{font-size:10px;color:#9aa1ab}
  .err{font-size:11px;color:var(--danger);font-weight:600;margin-top:2px}
  .section-tag{grid-column:1/-1;font-size:10px;font-weight:800;letter-spacing:.08em;color:#9aa1ab;text-transform:uppercase;margin-top:4px;border-top:1px solid var(--line2);padding-top:11px}
  .section-tag:first-child{border-top:none;margin-top:0;padding-top:0}
  .banner{background:#fdf2f2;border:1px solid #f3d0cf;color:#a13b39;border-radius:9px;padding:9px 12px;font-size:12px;margin-bottom:13px;display:flex;gap:8px}
  .banner.warn{background:#fff8ec;border-color:#f0e2c4;color:#8a6d2f}
  .banner ul{margin:4px 0 0;padding-left:18px}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;background:#fff;font-weight:600}
  .pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .arc-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px}
  .arc-row .ai{flex:1}
  .arc-row .nm{font-weight:700}
  .arc-row .mt{font-size:11px;color:var(--sub)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2127;color:#fff;padding:10px 16px;border-radius:9px;font-size:12.5px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;bottom:28px}
  .loading{padding:40px;color:var(--sub);font-size:13px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
