<script>
/* ============================================================
   多読講座 パイプライン クライアントJS（GAS版）
   ・データはスプレッドシート（サーバー Code.gs）に保存
   ・自動遷移／毎日のリマインドはサーバーの dailyJob が担当
   ・UIの挙動・バリデーション・配色はプロトタイプを「正」として再現
   ============================================================ */

var LEVELS = [];   // サーバーの meta から取得
var GRADES = [];
var STAG_OPTIONS = [];

/* ステータス定義（番号→ラベル/色）。プロトタイプに準拠 */
var STATUS = {
  1:{label:'①面談未実施',  color:'var(--s1)'},
  2:{label:'②面談済み(体験日程未定)', color:'var(--s2)'},
  3:{label:'③面談済み(体験日程確定)', color:'var(--s3)'},
  4:{label:'④体験後未追客', color:'var(--s4)'},
  5:{label:'⑤体験後追客済', color:'var(--s5)'},
  6:{label:'⑥ホールド(要理由)', color:'var(--s6)'},
  7:{label:'⑦成約', color:'var(--s7)'},
  8:{label:'⑧ロスト', color:'var(--s8)'},
};

/* 各ステータスへ移動する際に「累積で」必須な項目 */
var BASE = ['name','grade','country','parentEmail','staff','meetingDate','reason','level'];
var REQUIRED = {
  1:[],
  2:BASE.slice(),
  3:BASE.concat(['trialDate']),
  4:BASE.concat(['trialDate']),
  5:BASE.concat(['trialDate','reminderSentDate']),
  6:BASE.concat(['trialDate','reminderSentDate','stagnationReason']),
  7:BASE.concat(['trialDate']),
  8:BASE.slice()
};
var FIELD_LABEL = {
  name:'お名前', grade:'学年', country:'居住国', parentEmail:'保護者Email',
  staff:'面談担当社員', meetingDate:'面談実施日', reason:'お申込み理由', level:'開始レベル',
  trialDate:'体験授業日程', trialTime:'体験授業 時間', reminderSentDate:'リマインド送信日',
  stagnationReason:'停滞の理由'
};

var DB=[], editingId=null, pendingTarget=null, busy=false;

/* ステータスの数値⇔サーバーID変換 */
function num(s){return Number(String(s).replace('s',''));}
function sid(n){return 's'+n;}

/* ---------- 起動 ---------- */
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('addBtn').onclick=addInquiry;
  document.getElementById('arcBtn').onclick=openArchive;
  document.getElementById('reloadBtn').onclick=loadBoard;
  document.getElementById('mClose').onclick=closeModal;
  document.getElementById('mCancel').onclick=closeModal;
  document.getElementById('mSave').onclick=saveModal;
  document.getElementById('mDelete').onclick=deleteCard;
  document.getElementById('arcClose').onclick=function(){document.getElementById('arcOv').classList.remove('show');};
  document.getElementById('arcSearch').oninput=function(e){archSearch(e.target.value);};
  [document.getElementById('ov'),document.getElementById('arcOv')].forEach(function(o){
    o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('show');});
  });
  loadBoard();
});

/* ---------- サーバーから盤面ロード ---------- */
function loadBoard(){
  document.getElementById('board').innerHTML='<div class="loading">読み込み中…</div>';
  google.script.run
    .withSuccessHandler(onBoard)
    .withFailureHandler(function(e){
      document.getElementById('board').innerHTML='<div class="loading">読み込み失敗: '+esc(e&&e.message||e)+'</div>';
    })
    .getBoard();
}
function onBoard(data){
  GRADES = data.meta.gradeOptions || [];
  LEVELS = data.meta.levelOptions || [];
  STAG_OPTIONS = data.meta.stagnationOptions || [];
  DB = (data.records||[]).map(function(r){
    r.status = num(r.status);
    r.bell = !!r.reminderDue;
    return r;
  });
  render();
}

/* ---------- 盤面描画 ---------- */
function render(){
  var board=document.getElementById('board'); board.innerHTML='';
  for(var s=1;s<=8;s++){
    var items=DB.filter(function(c){return c.status===s;});
    var col=document.createElement('div'); col.className='col'; col.dataset.status=s;
    col.innerHTML='<div class="col-h"><span class="pip" style="background:'+STATUS[s].color+'"></span>'+
      '<span class="name">'+STATUS[s].label+'</span><span class="cnt">'+items.length+'</span></div>';
    var body=document.createElement('div'); body.className='col-body';
    if(!items.length) body.innerHTML='<div class="empty">なし</div>';
    items.forEach(function(c){body.appendChild(cardEl(c));});
    col.appendChild(body);
    col.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover');});
    col.addEventListener('dragleave',function(){this.classList.remove('dragover');});
    col.addEventListener('drop',function(e){e.preventDefault();this.classList.remove('dragover');
      var id=e.dataTransfer.getData('id'); if(id) openModal(id, Number(this.dataset.status));});
    board.appendChild(col);
  }
}

/* 各項目をラベル付きで明記したカード */
function cardEl(c){
  var el=document.createElement('div'); el.className='card'; el.draggable=true;
  var nm = c.name || (c.intakeName ? c.intakeName+'（問い合わせ）' : '未入力（問い合わせ）');

  var rows=[];
  function row(k,v){ if(v) rows.push('<div class="r"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'); }
  row('学年', esc(c.grade));
  row('居住国', esc(c.country));
  if(c.level) rows.push('<div class="r"><span class="k">レベル</span><span class="v"><span class="lvl">'+esc(c.level)+'</span></span></div>');
  row('担当', esc(c.staff));
  row('面談', esc(c.meetingDate));
  // 体験は日付＋時間をまとめて表示
  var trial = c.trialDate ? (esc(c.trialDate)+(c.trialTime?' '+esc(c.trialTime):'')) : '';
  row('体験', trial);
  row('催促', esc(c.reminderSentDate));
  if(c.status===6) row('停滞', esc(c.stagnationReason));
  if(c.status===8) row('ロスト', esc(c.lostAt));

  el.innerHTML='<div class="nm">'+esc(nm)+(c.bell?'<span class="bell">🔔 催促</span>':'')+'</div>'+
    '<div class="rows">'+rows.join('')+'</div>';
  el.addEventListener('dragstart',function(e){e.dataTransfer.setData('id',c.id);});
  el.addEventListener('click',function(){openModal(c.id,c.status);});
  return el;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

/* ---------- モーダル ---------- */
function openModal(id, target){
  var c=DB.find(function(x){return x.id===id;}); if(!c)return;
  editingId=id; pendingTarget = (target==null?c.status:target);
  var m=document.getElementById('mBody');
  document.getElementById('mTitle').textContent = c.name || c.intakeName || 'お問い合わせ';
  document.getElementById('mSub').textContent = '現在: '+STATUS[c.status].label;

  m.innerHTML =
    '<div class="move-row">'+
      '<label>ステータス移動</label>'+
      '<select id="f_target">'+[1,2,3,4,5,6,7,8].map(function(s){return '<option value="'+s+'" '+(s===pendingTarget?'selected':'')+'>'+STATUS[s].label+'</option>';}).join('')+'</select>'+
    '</div>'+
    '<div id="errBox"></div>'+
    '<div class="grid" id="formGrid">'+
      '<div class="section-tag">面談情報</div>'+
      txt('name','お名前',c.name,true)+
      sel('grade','学年',c.grade,GRADES,true)+
      txt('country','居住国',c.country,true)+
      txt('staff','面談担当社員',c.staff,true)+
      txt('parentEmail','保護者Email',c.parentEmail,true,'email')+
      txt('otherEmail','その他Email',c.otherEmail,false,'email')+
      dt('meetingDate','面談実施日',c.meetingDate,true)+
      sel('level','開始レベル',c.level,LEVELS,true)+
      ta('reason','お申込み理由',c.reason,true)+
      ta('notes','特記事項',c.notes,false)+

      '<div class="section-tag">体験授業</div>'+
      dt('trialDate','体験授業日程',c.trialDate,true)+
      tm('trialTime','体験授業 時間',c.trialTime,false)+

      '<div class="section-tag">追客 / ホールド</div>'+
      dt('reminderSentDate','リマインド送信日',c.reminderSentDate,true)+
      stagnationBlock(c)+

      '<div class="section-tag" data-k="_lostsection">ロスト</div>'+
      '<div class="fld full" data-k="preMeetingLost">'+
        '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600">'+
          '<input type="checkbox" id="f_preMeetingLost" style="width:16px;height:16px" '+(c.preMeetingLost?'checked':'')+'>'+
          '面談前ロスト（チェックを入れると必須項目なしで⑧へ移動できます）'+
        '</label>'+
        '<div class="hint">未チェックのまま⑧へ移すと、面談情報の必須項目がすべて必要です。</div>'+
      '</div>'+
    '</div>';

  document.getElementById('f_target').addEventListener('change',function(e){pendingTarget=Number(e.target.value); refreshReq();});
  bindStagnation();
  refreshReq();
  document.getElementById('errBox').innerHTML='';
  show('ov');
}
function txt(k,l,v,req,type){type=type||'text';return '<div class="fld" data-k="'+k+'"><label>'+l+(req?'<span class="req">*</span>':'<span class="opt">任意</span>')+'</label><input id="f_'+k+'" type="'+type+'" value="'+esc(v)+'"></div>';}
function dt(k,l,v,req){return '<div class="fld" data-k="'+k+'"><label>'+l+(req?'<span class="req">*</span>':'')+'</label><input id="f_'+k+'" type="date" value="'+esc(v)+'"></div>';}
function tm(k,l,v,req){return '<div class="fld" data-k="'+k+'"><label>'+l+(req?'<span class="req">*</span>':'<span class="opt">任意</span>')+'</label><input id="f_'+k+'" type="time" value="'+esc(v)+'"></div>';}
function ta(k,l,v,req){return '<div class="fld full" data-k="'+k+'"><label>'+l+(req?'<span class="req">*</span>':'<span class="opt">任意</span>')+'</label><textarea id="f_'+k+'">'+esc(v)+'</textarea></div>';}
function sel(k,l,v,opts,req){return '<div class="fld" data-k="'+k+'"><label>'+l+(req?'<span class="req">*</span>':'')+'</label><select id="f_'+k+'"><option value="">— 選択 —</option>'+opts.map(function(o){return '<option '+(o===v?'selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select></div>';}
function stagnationBlock(c){
  var opts = STAG_OPTIONS.length ? STAG_OPTIONS : ['1. 成約待ち','2. これからもう一度リマインド予定','3. その他'];
  var isOther = c.stagnationReason && String(c.stagnationReason).charAt(0)==='3';
  return '<div class="fld full" data-k="stagnationReason"><label>停滞の理由<span class="req">*</span><span class="hint" style="margin-left:6px">選択すると⑥ホールドへ移動します</span></label>'+
    '<div class="pillrow" id="stagPills">'+opts.map(function(o){return '<span class="pill '+(c.stagnationReason===o?'on':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</span>';}).join('')+'</div>'+
    '<input id="f_stagnationOther" placeholder="「3. その他」の場合は理由を記入" value="'+esc(c.stagnationOther)+'" style="margin-top:7px;display:'+(isOther?'block':'none')+'">'+
    '<input type="hidden" id="f_stagnationReason" value="'+esc(c.stagnationReason)+'"></div>';
}
function bindStagnation(){
  var pills=document.getElementById('stagPills'); if(!pills)return;
  pills.querySelectorAll('.pill').forEach(function(p){
    p.addEventListener('click',function(){
      pills.querySelectorAll('.pill').forEach(function(x){x.classList.remove('on');});
      p.classList.add('on');
      var v=p.dataset.v; document.getElementById('f_stagnationReason').value=v;
      document.getElementById('f_stagnationOther').style.display = (String(v).charAt(0)==='3')?'block':'none';
      // 停滞理由を選んだら移動先を自動的に⑥へ
      document.getElementById('f_target').value=6; pendingTarget=6; refreshReq();
    });
  });
}
/* どの項目をハイライト/表示するか更新 */
function refreshReq(){
  var need=REQUIRED[pendingTarget]||[];
  document.querySelectorAll('#formGrid .fld').forEach(function(f){
    var k=f.dataset.k;
    var star=f.querySelector('.req');
    // 体験/追客/停滞の各欄は、必要なときか値があるときだけ表示
    if(k==='trialDate'||k==='reminderSentDate'||k==='stagnationReason'){
      f.style.display = (need.indexOf(k)!==-1) ? '' : (hasVal(k)?'':'none');
    }
    // 体験時間（任意）は、体験日が必要 or どちらかに値があるとき表示
    if(k==='trialTime'){
      f.style.display = (need.indexOf('trialDate')!==-1 || hasVal('trialDate') || hasVal('trialTime')) ? '' : 'none';
    }
    if(star) star.style.display = (need.indexOf(k)!==-1)?'':'none';
  });
  // 面談前ロストのチェック＆ロスト見出しは⑧へ移動するときだけ表示
  var lf=document.querySelector('#formGrid .fld[data-k="preMeetingLost"]');
  var ls=document.querySelector('#formGrid [data-k="_lostsection"]');
  if(lf) lf.style.display = pendingTarget===8 ? '' : 'none';
  if(ls) ls.style.display = pendingTarget===8 ? '' : 'none';
}
function hasVal(k){var e=document.getElementById('f_'+k); return !!(e && e.value && e.value.trim());}
function getVal(k){var e=document.getElementById('f_'+k); return e?e.value.trim():'';}

function saveModal(){
  if(busy)return;
  var c=DB.find(function(x){return x.id===editingId;}); if(!c)return;
  pendingTarget=Number(document.getElementById('f_target').value);

  // フォーム値を吸い上げ
  var data={};
  ['name','grade','country','parentEmail','otherEmail','staff','meetingDate','reason','level','notes','trialDate','trialTime','reminderSentDate','stagnationReason','stagnationOther'].forEach(function(k){data[k]=getVal(k);});
  var preLost=document.getElementById('f_preMeetingLost');
  data.preMeetingLost = preLost ? preLost.checked : false;

  // クライアント側の事前検証（最終判定はサーバー）
  var need=(REQUIRED[pendingTarget]||[]).slice();
  if(pendingTarget===8 && data.preMeetingLost) need=[];
  var missing=need.filter(function(k){ return k==='stagnationReason' ? !data.stagnationReason : !data[k]; });
  if(data.stagnationReason && String(data.stagnationReason).charAt(0)==='3' && need.indexOf('stagnationReason')!==-1 && !data.stagnationOther) missing.push('stagnationOther');

  document.querySelectorAll('#formGrid .fld').forEach(function(f){f.classList.remove('bad');});
  if(missing.length){ showMissing(missing); return; }

  // サーバーへ保存して移動
  setBusy(true);
  google.script.run
    .withSuccessHandler(function(res){
      setBusy(false);
      if(res.ok){ closeModal(); loadBoard(); toast(STATUS[pendingTarget].label+' に移動しました'); }
      else if(res.missing){ showMissingLabels(res.missing); }
      else { showMissingLabels([res.message||'移動できませんでした']); }
    })
    .withFailureHandler(function(e){ setBusy(false); showMissingLabels([e&&e.message||String(e)]); })
    .moveCard(editingId, sid(pendingTarget), data);
}
function showMissing(keys){
  keys.forEach(function(k){var f=document.querySelector('#formGrid .fld[data-k="'+(k==='stagnationOther'?'stagnationReason':k)+'"]'); if(f)f.classList.add('bad');});
  var labels=keys.map(function(k){return k==='stagnationOther'?'その他の理由(記入)':(FIELD_LABEL[k]||k);});
  showBanner(labels);
}
function showMissingLabels(labels){ showBanner(labels); }
function showBanner(labels){
  var uniq=[]; labels.forEach(function(l){if(uniq.indexOf(l)===-1)uniq.push(l);});
  document.getElementById('errBox').innerHTML='<div class="banner">⚠️ 「'+STATUS[pendingTarget].label+'」へ移動するには次の必須項目が必要です：<ul>'+uniq.map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul></div>';
}

function deleteCard(){
  if(busy)return;
  if(!confirm('このカードを削除しますか？（元に戻せません）'))return;
  setBusy(true);
  google.script.run
    .withSuccessHandler(function(res){ setBusy(false); if(res.ok){closeModal(); loadBoard(); toast('削除しました');} else { alert(res.message||'削除に失敗しました'); } })
    .withFailureHandler(function(e){ setBusy(false); alert(e&&e.message||String(e)); })
    .deleteCard(editingId);
}

/* ---------- お問い合わせ追加（手動 / HubSpot流入の代替） ---------- */
function addInquiry(){
  var n=prompt('お問い合わせ者名（①面談未実施に追加します）','');
  if(n===null)return;
  setBusy(true);
  google.script.run
    .withSuccessHandler(function(res){ setBusy(false); if(res.ok){ loadBoard(); toast('①面談未実施 に追加しました'); } })
    .withFailureHandler(function(e){ setBusy(false); alert(e&&e.message||String(e)); })
    .createCard({ intakeName:(n||''), name:'' });
}

/* ---------- アーカイブ ---------- */
function openArchive(){ document.getElementById('arcSearch').value=''; archSearch(''); show('arcOv'); }
function archSearch(q){
  document.getElementById('arcList').innerHTML='<div class="empty">検索中…</div>';
  google.script.run
    .withSuccessHandler(renderArchive)
    .withFailureHandler(function(e){document.getElementById('arcList').innerHTML='<div class="empty">エラー: '+esc(e&&e.message||e)+'</div>';})
    .searchArchive(q);
}
function renderArchive(list){
  var box=document.getElementById('arcList');
  if(!list||!list.length){box.innerHTML='<div class="empty">該当するアーカイブはありません</div>';return;}
  box.innerHTML=list.map(function(c){return '<div class="arc-row"><div class="ai"><div class="nm">'+esc(c.name||c.intakeName||'未入力')+'</div>'+
    '<div class="mt">'+esc(c.country||'')+' ・ '+esc(c.parentEmail||'')+' ・ ロスト '+esc(c.lostAt||'')+' → アーカイブ '+esc(c.archivedAt||'')+'</div></div>'+
    '<button class="primary" data-restore="'+esc(c.id)+'">パイプラインに戻す</button></div>';}).join('');
  box.querySelectorAll('[data-restore]').forEach(function(b){b.addEventListener('click',function(){restore(b.dataset.restore,b);});});
}
function restore(id,btn){
  if(btn){btn.disabled=true;btn.textContent='処理中…';}
  google.script.run
    .withSuccessHandler(function(res){ if(res.ok){ archSearch(document.getElementById('arcSearch').value); loadBoard(); toast('パイプラインに戻しました'); } else { toast(res.message||'失敗しました'); if(btn){btn.disabled=false;btn.textContent='パイプラインに戻す';} } })
    .withFailureHandler(function(e){ toast(e&&e.message||String(e)); if(btn){btn.disabled=false;btn.textContent='パイプラインに戻す';} })
    .restoreFromArchive(id);
}

/* ---------- 共通UI ---------- */
function show(id){document.getElementById(id).classList.add('show');}
function closeModal(){document.getElementById('ov').classList.remove('show');editingId=null;}
function setBusy(b){busy=b;document.getElementById('mSave').disabled=b;document.getElementById('mDelete').disabled=b;}
var toastTimer;
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},2200);}
</script>
